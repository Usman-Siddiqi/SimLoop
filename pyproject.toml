[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "simloop"
version = "0.1.0.dev0"
description = "Deterministic simulation testing for Python asyncio"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Usman Siddiqi" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "anyio>=4"]
# Only for regenerating the README GIF (scripts/render_gif.py).
visuals = ["pillow>=10"]

[project.scripts]
simloop = "simloop.cli:main"

[project.entry-points.pytest11]
simloop = "simloop.pytest_plugin"

[project.urls]
Homepage = "https://github.com/Usman-Siddiqi/SimLoop"

[tool.hatch.build.targets.wheel]
packages = ["src/simloop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "C4", "PIE", "RET"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
# `simloop.test` is a decorator factory, not a test function.
"src/simloop/_testing.py" = ["PT028"]
# The page template (HTML, CSS, JS) is embedded as one string.
"src/simloop/_html.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "examples"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["tests.*", "examples.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
