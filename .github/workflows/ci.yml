name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests examples scripts findings
      - run: ruff format --check src tests examples scripts findings
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: pytest
      - name: Example race is found and the fix passes
        env:
          PYTHONHASHSEED: "0"
        run: |
          ! simloop explore examples/inventory.py:main --seeds 200 --trace-last 0
          simloop explore examples/inventory.py:main_fixed --seeds 200

  findings:
    # The recorded findings must keep reproducing against the pinned versions.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -e . -r findings/requirements.txt
      - name: Run every findings script
        env:
          PYTHONHASHSEED: "0"
        run: |
          index=0
          for script in findings/[!_]*.py; do
            stem=$(basename "$script" .py)
            # Scripts with their own requirements run in the next job.
            [ -e "findings/requirements-$stem.txt" ] && continue
            index=$((index + 1))
            [ $((index % 4)) -eq ${{ matrix.shard }} ] || continue
            echo "::group::$script"
            python "$script"
            echo "::endgroup::"
          done

  findings-isolated:
    # Findings whose pinned versions conflict with requirements.txt.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run each script in its own environment
        env:
          PYTHONHASHSEED: "0"
        run: |
          for requirements in findings/requirements-*.txt; do
            stem=${requirements#findings/requirements-}
            stem=${stem%.txt}
            echo "::group::findings/$stem.py"
            python -m venv "/tmp/venv-$stem"
            "/tmp/venv-$stem/bin/pip" install -q -e . -r "$requirements"
            "/tmp/venv-$stem/bin/python" "findings/$stem.py"
            echo "::endgroup::"
          done

  findings-cpython311:
    # This finding is specific to Python 3.11: it must reproduce there.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - env:
          PYTHONHASHSEED: "0"
        run: python findings/cpython311_wait_for_lock.py
